<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center ion-title-bold">Mis Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-input 
      type="text" 
      placeholder="Nueva Tarea" 
      name="task" 
      [(ngModel)]="task">
    </ion-input>

    <ion-button slot="end" (click)="addTask()" >
      <ion-icon name="add-outline"></ion-icon>
    </ion-button>
  </ion-item>

  @if (tasks.length === 0) {
    <ion-label class="ion-text-center" style="display: block; margin-top: 20px;">
      No hay tareas pendientes
    </ion-label>
  } @else {
    <ion-list>
      @for (task of tasks; track task) {
        <ion-item-sliding> 
          <ion-item>
            <ion-label>{{ task }}</ion-label>
          </ion-item>

          <ion-item-options side="end">
            <!-- Botón del cesto de basura corregido -->
            <ion-item-option color="danger" (click)="confirmDelete(task)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  }
</ion-content>
